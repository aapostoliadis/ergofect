<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2260" viewBox="0 0 1400 2260" role="img" aria-labelledby="title desc"><title id="title">The Ergofect workspace blueprint</title><desc id="desc">An illustrative operating model: shared evidence connects workspace capabilities, a reviewed project journey, revision checks, governed follow-through, and human oversight.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#5df0a8"/></marker></defs><rect width="1400" height="2260" fill="#070d1b"/><style>text{font-family:Inter,Arial,sans-serif;fill:#f3f6ff}.muted{fill:#b6c5df}.mint{fill:#5df0a8}</style><text x="60" y="60" font-size="15" font-weight="600" class="mint">ERGOFECT. / WORKSPACE BLUEPRINT</text><text x="60" y="125" font-size="54" font-weight="700" class="">Connected capabilities.</text><text x="60" y="186" font-size="54" font-weight="700" class="mint">Accountable decisions.</text><text x="60" y="230.0" font-size="19" font-weight="400" class="muted">Workspace capabilities, connected by shared evidence. From the first document to the next approved change.</text><text x="60" y="303" font-size="20" font-weight="600" class="">Shared evidence</text><text x="390" y="303" font-size="20" font-weight="600" class="">Defined workflows</text><text x="720" y="303" font-size="20" font-weight="600" class="">Visible dependencies</text><text x="1050" y="303" font-size="20" font-weight="600" class="">Human review</text><path d="M60 330H1340" stroke="#34415d"/><rect x="60" y="350" width="40" height="40" rx="10" fill="#153c36"/><text x="73" y="377" font-size="22" font-weight="600" class="mint">A</text><text x="118" y="362" font-size="12" font-weight="500" class="mint">THE WORKSPACE FOUNDATION</text><text x="118" y="394" font-size="29" font-weight="600" class="">One record. Connected capabilities.</text><rect x="60" y="420" width="390" height="170" rx="16" fill="#101c30" stroke="#364762"/><text x="82" y="456" font-size="22" font-weight="600" class="">Agreed sources</text><text x="82" y="488.0" font-size="17" font-weight="400" class="muted">Documents, enquiries, emails,</text><text x="82" y="513.5" font-size="17" font-weight="400" class="muted">project records, and survey</text><text x="82" y="539.0" font-size="17" font-weight="400" class="muted">findings.</text><rect x="505" y="420" width="390" height="170" rx="16" fill="#0d282b" stroke="#4f967f"/><text x="527" y="456" font-size="22" font-weight="600" class="">Shared evidence record</text><text x="527" y="488.0" font-size="17" font-weight="400" class="muted">Sources, versions, assumptions,</text><text x="527" y="513.5" font-size="17" font-weight="400" class="muted">owners, decisions, and approval</text><text x="527" y="539.0" font-size="17" font-weight="400" class="muted">history.</text><rect x="950" y="420" width="390" height="170" rx="16" fill="#101c30" stroke="#364762"/><text x="972" y="456" font-size="22" font-weight="600" class="">Workspace capabilities</text><text x="972" y="488.0" font-size="17" font-weight="400" class="muted">Intake, quotation, estimation,</text><text x="972" y="513.5" font-size="17" font-weight="400" class="muted">planning, scheduling, and change</text><text x="972" y="539.0" font-size="17" font-weight="400" class="muted">review.</text><path d="M455 505L497 505" fill="none" stroke="#5df0a8" stroke-width="2" marker-end="url(#arrow)"/><path d="M900 505L942 505" fill="none" stroke="#5df0a8" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="610" width="1280" height="110" rx="16" fill="#101c30" stroke="#364762"/><text x="82" y="646" font-size="22" font-weight="600" class="">Support &amp; Knowledge Assistant</text><text x="82" y="678.0" font-size="17" font-weight="400" class="muted">Across the workspace: find evidence, explain the current position, prepare grounded answers, and escalate uncertainty.</text><text x="60" y="759" font-size="18" font-weight="600" class="mint">Rules &amp; workflows</text><text x="60" y="788" font-size="16" font-weight="400" class="muted">Templates, routing, checks, escalation.</text><text x="500" y="759" font-size="18" font-weight="600" class="mint">Planning dependencies</text><text x="500" y="788" font-size="16" font-weight="400" class="muted">Prerequisites, capacity, constraints.</text><text x="940" y="759" font-size="18" font-weight="600" class="mint">Human review gates</text><text x="940" y="788" font-size="16" font-weight="400" class="muted">Named owners approve commitments.</text><path d="M60 820H1340" stroke="#34415d"/><rect x="60" y="840" width="40" height="40" rx="10" fill="#153c36"/><text x="73" y="867" font-size="22" font-weight="600" class="mint">B</text><text x="118" y="852" font-size="12" font-weight="500" class="mint">THE PROJECT JOURNEY</text><text x="118" y="884" font-size="29" font-weight="600" class="">From incoming work to an approved plan.</text><rect x="60" y="912" width="265" height="252" rx="16" fill="#101c30" stroke="#364762"/><text x="82" y="948" font-size="22" font-weight="600" class="">01 / Document intake</text><text x="82" y="980.0" font-size="17" font-weight="400" class="muted">Extract the brief, link</text><text x="82" y="1005.5" font-size="17" font-weight="400" class="muted">sources, and flag</text><text x="82" y="1031.0" font-size="17" font-weight="400" class="muted">missing details.</text><text x="82" y="1080.0" font-size="15" font-weight="400" class="mint">GATE: confirm the brief</text><text x="82" y="1102.5" font-size="15" font-weight="400" class="mint">and resolve gaps.</text><rect x="355" y="912" width="365" height="252" rx="16" fill="#101c30" stroke="#364762"/><text x="377" y="948" font-size="22" font-weight="600" class="">02 / Choose the route</text><text x="377" y="980.0" font-size="17" font-weight="400" class="muted">Standard quotation: agreed scope,</text><text x="377" y="1005.5" font-size="17" font-weight="400" class="muted">templates, and pricing rules. OR</text><text x="377" y="1031.0" font-size="17" font-weight="400" class="muted">Bespoke estimate: tailored effort,</text><text x="377" y="1056.5" font-size="17" font-weight="400" class="muted">assumptions, and exclusions.</text><text x="377" y="1105.0" font-size="15" font-weight="400" class="mint">GATE: approve scope, price, and</text><text x="377" y="1127.5" font-size="15" font-weight="400" class="mint">terms before release.</text><rect x="750" y="912" width="280" height="252" rx="16" fill="#101c30" stroke="#364762"/><text x="772" y="948" font-size="22" font-weight="600" class="">03 / Project planning</text><text x="772" y="980.0" font-size="17" font-weight="400" class="muted">Tasks, milestones,</text><text x="772" y="1005.5" font-size="17" font-weight="400" class="muted">owners, and dependencies</text><text x="772" y="1031.0" font-size="17" font-weight="400" class="muted">from approved scope.</text><text x="772" y="1080.0" font-size="15" font-weight="400" class="mint">GATE: agree the delivery</text><text x="772" y="1102.5" font-size="15" font-weight="400" class="mint">baseline.</text><rect x="1060" y="912" width="280" height="252" rx="16" fill="#101c30" stroke="#364762"/><text x="1082" y="948" font-size="22" font-weight="600" class="">04 / Scheduling</text><text x="1082" y="980.0" font-size="17" font-weight="400" class="muted">Sequence work against</text><text x="1082" y="1005.5" font-size="17" font-weight="400" class="muted">capacity and confirmed</text><text x="1082" y="1031.0" font-size="17" font-weight="400" class="muted">prerequisites.</text><text x="1082" y="1080.0" font-size="15" font-weight="400" class="mint">GATE: approve dates and</text><text x="1082" y="1102.5" font-size="15" font-weight="400" class="mint">resources.</text><path d="M329 1010L347 1010" fill="none" stroke="#5df0a8" stroke-width="2" marker-end="url(#arrow)"/><path d="M724 1010L742 1010" fill="none" stroke="#5df0a8" stroke-width="2" marker-end="url(#arrow)"/><path d="M1034 1010L1052 1010" fill="none" stroke="#5df0a8" stroke-width="2" marker-end="url(#arrow)"/><text x="60" y="1201" font-size="17" font-weight="400" class="muted">New findings return to the evidence record and reopen the relevant review gate.</text><path d="M60 1230H1340" stroke="#34415d"/><rect x="60" y="1250" width="40" height="40" rx="10" fill="#153c36"/><text x="73" y="1277" font-size="22" font-weight="600" class="mint">C</text><text x="118" y="1262" font-size="12" font-weight="500" class="mint">EVIDENCE BEFORE ACTION</text><text x="118" y="1294" font-size="29" font-weight="600" class="">Make every proposed change reviewable.</text><rect x="60" y="1325" width="620" height="195" rx="16" fill="#101c30" stroke="#364762"/><text x="82" y="1361" font-size="22" font-weight="600" class="">Revision impact</text><text x="82" y="1393.0" font-size="17" font-weight="400" class="muted">Compare new evidence with the approved baseline. Identify</text><text x="82" y="1418.5" font-size="17" font-weight="400" class="muted">affected deliverables, effort, cost, dates, and</text><text x="82" y="1444.0" font-size="17" font-weight="400" class="muted">dependencies. Make unknowns explicit.</text><rect x="710" y="1325" width="630" height="195" rx="16" fill="#0d282b" stroke="#4f967f"/><text x="732" y="1361" font-size="22" font-weight="600" class="">A review packet, not a silent update</text><text x="732" y="1393.0" font-size="17" font-weight="400" class="muted">Source + version → impact + uncertainty → suggested</text><text x="732" y="1418.5" font-size="17" font-weight="400" class="muted">response or scope variation → named reviewer + recorded</text><text x="732" y="1444.0" font-size="17" font-weight="400" class="muted">decision.</text><text x="60" y="1557" font-size="18" font-weight="400" class="mint">Accept, clarify, or reject. Update the baseline only after approval.</text><path d="M60 1580H1340" stroke="#34415d"/><rect x="60" y="1600" width="40" height="40" rx="10" fill="#153c36"/><text x="73" y="1627" font-size="22" font-weight="600" class="mint">D</text><text x="118" y="1612" font-size="12" font-weight="500" class="mint">GOVERNED FOLLOW-THROUGH</text><text x="118" y="1644" font-size="29" font-weight="600" class="">Close the loop. Keep the decision visible.</text><rect x="60" y="1675" width="410" height="228" rx="16" fill="#101c30" stroke="#364762"/><text x="82" y="1711" font-size="22" font-weight="600" class="">Follow-on survey</text><text x="82" y="1743.0" font-size="17" font-weight="400" class="muted">Agreed trigger → survey → findings →</text><text x="82" y="1768.5" font-size="17" font-weight="400" class="muted">impact review. A person approves the</text><text x="82" y="1794.0" font-size="17" font-weight="400" class="muted">survey and any resulting commitment.</text><rect x="495" y="1675" width="410" height="228" rx="16" fill="#101c30" stroke="#364762"/><text x="517" y="1711" font-size="22" font-weight="600" class="">Comment responses</text><text x="517" y="1743.0" font-size="17" font-weight="400" class="muted">Comment + source → draft → reviewed</text><text x="517" y="1768.5" font-size="17" font-weight="400" class="muted">response. A named reviewer approves</text><text x="517" y="1794.0" font-size="17" font-weight="400" class="muted">external responses before sending.</text><rect x="930" y="1675" width="410" height="228" rx="16" fill="#101c30" stroke="#364762"/><text x="952" y="1711" font-size="22" font-weight="600" class="">Scope variations</text><text x="952" y="1743.0" font-size="17" font-weight="400" class="muted">Request → scope, cost, schedule, and</text><text x="952" y="1768.5" font-size="17" font-weight="400" class="muted">dependency impact → commercial</text><text x="952" y="1794.0" font-size="17" font-weight="400" class="muted">approval before the baseline</text><text x="952" y="1819.5" font-size="17" font-weight="400" class="muted">changes.</text><text x="60" y="1940" font-size="17" font-weight="400" class="mint">Every loop returns to the shared evidence record and the relevant approval gate.</text><path d="M60 1970H1340" stroke="#34415d"/><rect x="60" y="1990" width="40" height="40" rx="10" fill="#153c36"/><text x="73" y="2017" font-size="22" font-weight="600" class="mint">E</text><text x="118" y="2002" font-size="12" font-weight="500" class="mint">PEOPLE STEER THE WORK</text><text x="118" y="2034" font-size="29" font-weight="600" class="">Measure the handoff. Own the outcome.</text><text x="60" y="2080" font-size="20" font-weight="600" class="">Define the boundaries</text><text x="60" y="2110.0" font-size="16" font-weight="400" class="muted">Sources, permissions, rules,</text><text x="60" y="2134.0" font-size="16" font-weight="400" class="muted">reviewers, escalation.</text><text x="500" y="2080" font-size="20" font-weight="600" class="">Review the exceptions</text><text x="500" y="2110.0" font-size="16" font-weight="400" class="muted">Resolve gaps. Approve commitments and</text><text x="500" y="2134.0" font-size="16" font-weight="400" class="muted">changes.</text><text x="940" y="2080" font-size="20" font-weight="600" class="">Measure the work</text><text x="940" y="2110.0" font-size="16" font-weight="400" class="muted">Turnaround, rework, open items,</text><text x="940" y="2134.0" font-size="16" font-weight="400" class="muted">review effort.</text><text x="60" y="2190.0" font-size="14" font-weight="400" class="muted">Illustrative operating model. Capabilities and controls are agreed per engagement; not a claim of universal deployment.</text><text x="60" y="2232" font-size="14" font-weight="400" class="mint">ergofect.com/workspace-blueprint</text><text x="1060" y="2232" font-size="14" font-weight="400" class="muted">ERGOFECT. / NOV 2026</text></svg>